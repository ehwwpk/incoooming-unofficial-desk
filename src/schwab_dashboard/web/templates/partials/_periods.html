<div class="period-data-source" data-period-console hidden aria-hidden="true">
  {% for window in snapshot.performance_windows %}
  <span
    data-period-sheet="{{ window.key }}"
    data-window-label="{{ window.label }}"
    data-range-label="{{ window.range_label }}"
    data-option-cash="{{ window.option_cash | money }}"
    data-total-cash="{{ window.total_cash | money }}"
    data-dividends="{{ window.dividends | money }}"
    data-gross="{{ window.gross_premium | money }}"
    data-option-apr="{{ window.annualized_option_yield | percent }}"
    data-total-apr="{{ window.annualized_total_yield | percent }}"
    data-calls="{{ window.call_tickets }}"
    data-contracts="{{ window.contracts }}"
    data-win-rate="{{ window.win_rate | percent }}"
    data-capture="{{ window.premium_capture_percent | percent }}"
    data-buyback-drag="{{ window.buyback_drag_percent | percent }}"
    data-monthly-run-rate="{{ window.monthly_option_run_rate }}"
    data-monthly-total-run-rate="{{ window.monthly_total_run_rate }}"
    data-monthly-option-average="{{ window.monthly_option_run_rate | money }}"
    data-monthly-total-average="{{ window.monthly_total_run_rate | money }}"
  ></span>
  {% endfor %}
</div>
