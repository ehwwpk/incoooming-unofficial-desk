[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "incoooming-unofficial-desk"
version = "0.1.0"
description = "Local covered-call and cash-secured-put accounting dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Incoooming contributors" }]
keywords = ["options", "portfolio", "schwab", "covered-calls", "cash-secured-puts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: MacOS :: MacOS X",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "alembic>=1.18.5,<2",
  "fastapi>=0.139.2,<0.142",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<27",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.51,<2.1",
  "tzdata>=2026.3,<2027",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "build>=1.2,<2",
  "mypy>=1.16,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/ehwwpk/incoooming-unofficial-desk"
Repository = "https://github.com/ehwwpk/incoooming-unofficial-desk"
Issues = "https://github.com/ehwwpk/incoooming-unofficial-desk/issues"

[project.scripts]
schwab-dashboard = "schwab_dashboard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_dashboard"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "schwab_dashboard/alembic.ini"
"migrations" = "schwab_dashboard/migrations"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/schwab_dashboard"]
mypy_path = "src"
