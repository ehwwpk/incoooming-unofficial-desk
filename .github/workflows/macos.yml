name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.runner }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    env:
      INCOOOMING_EXPECTED_ARCH: ${{ matrix.architecture }}

    steps:
      - name: Set isolated test paths
        run: |
          mkdir -p "$RUNNER_TEMP/macos-evidence"
          printf '%s\n' \
            "INCOOOMING_EVIDENCE_DIR=$RUNNER_TEMP/macos-evidence" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check native platform and Python
        run: |
          python scripts/macos_smoke_support.py
          python -m ruff check .
          python -m mypy

      - name: Check dependencies and common security mistakes
        run: |
          python -m pip_audit --local --skip-editable --progress-spinner off
          python -m bandit -r src -q -s B101,B105

      - name: Test
        run: python -m pytest --cov=schwab_dashboard --cov-fail-under=80

      - name: Build and install a fresh wheel
        env:
          SCHWAB_AUTO_SYNC_ENABLED: "false"
          SCHWAB_DASHBOARD_DATA_DIR: ${{ runner.temp }}/installed book
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/wheel environment"
          "$RUNNER_TEMP/wheel environment/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel environment/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel environment/bin/python" -c 'import pathlib, sys, schwab_dashboard; assert pathlib.Path(schwab_dashboard.__file__).is_relative_to(pathlib.Path(sys.prefix)), schwab_dashboard.__file__'
          "$RUNNER_TEMP/wheel environment/bin/schwab-dashboard" db-upgrade
          "$RUNNER_TEMP/wheel environment/bin/schwab-dashboard" doctor
          "$RUNNER_TEMP/wheel environment/bin/python" "$GITHUB_WORKSPACE/scripts/smoke-installed-web.py"

      - name: Test the Mac setup and launch commands
        run: python scripts/smoke-macos-launchers.py

      - name: Test native Keychain persistence with disposable dummy tokens
        if: matrix.python-version == '3.14'
        timeout-minutes: 3
        run: '"$RUNNER_TEMP/wheel environment/bin/python" scripts/smoke-macos-keychain.py'

      - name: Prepare native browser automation
        if: matrix.python-version == '3.14'
        timeout-minutes: 2
        run: |
          python -m pip install -r scripts/requirements-macos-browser.txt
          sudo /usr/bin/safaridriver --enable

      - name: Test the Safari interface
        if: matrix.python-version == '3.14'
        timeout-minutes: 5
        run: python scripts/smoke-macos-safari.py

      - name: Test Chrome with real CSV files
        if: matrix.python-version == '3.14' && !cancelled()
        timeout-minutes: 8
        run: python scripts/smoke-macos-chrome.py

      - name: Keep native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.architecture }}-python-${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/macos-evidence
          if-no-files-found: error
          retention-days: 14
